[project]
name = "observatorio-energia"
version = "0.2.0"
description = "Observatorio Energia y Clima Colombia - Capas Bronce, Plata y Oro (EA2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "openpyxl>=3.1",
    "duckdb>=1.1",
    "pandera>=0.20",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
